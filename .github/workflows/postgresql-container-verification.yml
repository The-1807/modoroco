name: PostgreSQL and Container Verification

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [ci/hosted-container-verification, perf/runtime-dependency-separation]

concurrency:
  group: postgresql-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11.29"

jobs:
  quality-python-313:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Locked environment
        run: uv sync --python 3.13 --locked --all-extras --all-groups
      - name: Quality gate
        run: |
          mkdir -p artifacts/quality
          set -o pipefail
          python --version | tee artifacts/quality/python.txt
          uv run --no-sync ruff format --check . 2>&1 | tee artifacts/quality/ruff-format.txt
          uv run --no-sync ruff check . 2>&1 | tee artifacts/quality/ruff-lint.txt
          uv run --no-sync pyright 2>&1 | tee artifacts/quality/pyright.txt
          uv run --no-sync pytest --junitxml=artifacts/quality/pytest.xml \
            --cov-report=xml:artifacts/quality/coverage.xml \
            2>&1 | tee artifacts/quality/pytest.txt
          uv run --no-sync python scripts/generate_openapi.py --check
          git diff --exit-code -- uv.lock openapi/openapi.json
      - name: Import and secret checks
        run: |
          uv run --no-sync python - <<'PY'
          import modoroco.domain
          import modoroco.infrastructure.database
          import modoroco.runtime.api
          import modoroco.runtime.worker
          import modoroco_ui
          import scripts.generate_openapi
          print("all import boundaries passed")
          PY
          ! git grep -En 'gh[opsu]_[A-Za-z0-9_]{30,}|BEGIN (RSA |EC |OPENSSH )?PRIV[A]TE KEY'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-python-313
          path: artifacts/quality
          retention-days: 14

  server-profile:
    needs: quality-python-313
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --python 3.13 --locked --no-dev --extra server
      - run: uv run --no-sync python scripts/verify_dependency_profile.py server
      - run: uv run --no-sync python scripts/generate_openapi.py --check

  desktop-profile:
    needs: quality-python-313
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libegl1
      - run: uv sync --python 3.13 --locked --extra desktop --group dev
      - run: uv run --no-sync python scripts/verify_dependency_profile.py desktop
      - run: uv run --no-sync pytest tests/test_timer.py

  postgresql-integration:
    needs: [server-profile, desktop-profile]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: modoroco_test
          POSTGRES_USER: modoroco_test
          POSTGRES_PASSWORD: workflow-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U modoroco_test -d modoroco_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      MODOROCO_ENVIRONMENT: test
      MODOROCO_DATABASE_URL: postgresql+asyncpg://modoroco_test:workflow-only-password@localhost:5432/modoroco_test
      MODOROCO_TEST_DATABASE_URL: postgresql+asyncpg://modoroco_test:workflow-only-password@localhost:5432/modoroco_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --python 3.13 --locked --extra server --group dev
      - name: PostgreSQL migration and schema
        run: |
          mkdir -p artifacts/postgresql
          set -o pipefail
          uv run --no-sync alembic upgrade head 2>&1 | tee artifacts/postgresql/migration.txt
          uv run --no-sync alembic upgrade head 2>&1 | tee -a artifacts/postgresql/migration.txt
          uv run --no-sync alembic current | tee artifacts/postgresql/current.txt
          PGPASSWORD=workflow-only-password psql -h localhost -U modoroco_test -d modoroco_test \
            -c '\dt+' -c '\di+' -c '\d+ idempotency_records' -c '\d+ session_phase_history' \
            > artifacts/postgresql/schema.txt
      - name: Real PostgreSQL integration suite
        run: |
          set -o pipefail
          uv run --no-sync pytest tests/postgresql -vv \
            --junitxml=artifacts/postgresql/pytest.xml \
            2>&1 | tee artifacts/postgresql/pytest.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgresql-integration
          path: artifacts/postgresql
          retention-days: 14

  docker-image:
    needs: postgresql-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: modoroco:gha-verification-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan production image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: modoroco:gha-verification-${{ github.sha }}
          fail-build: false
          severity-cutoff: high
          output-format: table
      - name: Inspect image
        run: |
          mkdir -p artifacts/image
          image="modoroco:gha-verification-${GITHUB_SHA}"
          docker image inspect "$image" > artifacts/image/inspect.json
          docker image inspect "$image" --format '{{.Id}} {{.Size}}' > artifacts/image/identity-and-size.txt
          docker history --no-trunc "$image" > artifacts/image/history.txt
          docker image ls "$image" --format '{{.ID}} {{.Size}}' | tee artifacts/image/size.txt
          test "$(docker run --rm "$image" id -u)" != "0"
          docker run --rm "$image" python --version | tee artifacts/image/python.txt
          docker run --rm "$image" python -c \
            'import modoroco.domain, modoroco.runtime.api, modoroco.runtime.worker'
          docker run --rm "$image" python -c \
            'import importlib.metadata as m; print("\n".join(sorted(d.metadata["Name"] for d in m.distributions())))' \
            | tee artifacts/image/packages.txt
          ! grep -Ei '^(PySide6|PySide6_Addons|PySide6_Essentials|shiboken6|pytest|hypothesis|ruff|pyright|coverage)$' \
            artifacts/image/packages.txt
          docker run --rm "$image" test -f /app/migrations/env.py
          ! grep -E 'MODOROCO_BOOTSTRAP_API_KEY=|POSTGRES_PASSWORD=' \
            artifacts/image/inspect.json artifacts/image/history.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-image
          path: artifacts/image
          retention-days: 14

  compose-system:
    needs: docker-image
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: modoroco-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --python 3.13 --locked --no-dev
      - name: Runtime-only configuration
        run: |
          password="$(openssl rand -hex 24)"
          api_key="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          echo "::add-mask::$api_key"
          {
            echo "POSTGRES_PASSWORD=$password"
            echo "MODOROCO_ENVIRONMENT=production"
            echo "MODOROCO_DATABASE_URL=postgresql+asyncpg://modoroco:$password@postgres:5432/modoroco"
            echo "MODOROCO_BOOTSTRAP_API_KEY=$api_key"
            echo "MODOROCO_WORKER_POLL_SECONDS=0.25"
            echo "MODOROCO_WORKER_BATCH_SIZE=50"
          } > .env
          echo "MODOROCO_VERIFY_API_KEY=$api_key" >> "$GITHUB_ENV"
      - name: Validate and start Compose
        run: |
          mkdir -p artifacts/compose
          uname -a | tee artifacts/compose/runner.txt
          docker version | tee artifacts/compose/docker-version.txt
          docker compose version | tee artifacts/compose/compose-version.txt
          docker compose config --quiet
          docker compose config > artifacts/compose/config.txt
          docker compose up -d --build --scale worker=2
          docker compose ps --all | tee artifacts/compose/ps-start.txt
          docker compose exec -T postgres postgres --version \
            | tee artifacts/compose/postgresql-version.txt
      - name: System verification
        run: uv run --no-sync python scripts/verify_compose_system.py
      - name: Capture diagnostics
        if: always()
        run: |
          docker compose ps --all > artifacts/compose/ps-final.txt 2>&1 || true
          docker compose logs --no-color > artifacts/compose/compose.log 2>&1 || true
          docker network ls > artifacts/compose/networks.txt 2>&1 || true
          docker volume ls > artifacts/compose/volumes.txt 2>&1 || true
          docker compose exec -T postgres pg_dump -U modoroco -d modoroco \
            --schema-only > artifacts/compose/schema.sql 2>&1 || true
          docker compose down --remove-orphans >> artifacts/compose/cleanup.txt 2>&1 || true
          docker volume rm "${COMPOSE_PROJECT_NAME}_postgres-data" \
            >> artifacts/compose/cleanup.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-system
          path: artifacts/compose
          retention-days: 14

  verification-summary:
    if: always()
    needs:
      - quality-python-313
      - server-profile
      - desktop-profile
      - postgresql-integration
      - docker-image
      - compose-system
    runs-on: ubuntu-latest
    steps:
      - name: Enforce complete gate
        env:
          QUALITY: ${{ needs.quality-python-313.result }}
          SERVER: ${{ needs.server-profile.result }}
          DESKTOP: ${{ needs.desktop-profile.result }}
          POSTGRESQL: ${{ needs.postgresql-integration.result }}
          IMAGE: ${{ needs.docker-image.result }}
          COMPOSE: ${{ needs.compose-system.result }}
        run: |
          mkdir -p artifacts/summary
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg quality "$QUALITY" \
            --arg server "$SERVER" \
            --arg desktop "$DESKTOP" \
            --arg postgresql "$POSTGRESQL" \
            --arg image "$IMAGE" \
            --arg compose "$COMPOSE" \
            '{
              commit:$commit,
              jobs:{
                quality_python_313:$quality,
                server_profile:$server,
                desktop_profile:$desktop,
                postgresql_integration:$postgresql,
                docker_image:$image,
                compose_system:$compose
              },
              checks:{
                migrations:$postgresql,
                api_liveness:$compose,
                api_readiness:$compose,
                worker_readiness:$compose,
                metrics:$compose,
                automatic_transition:$compose,
                phase_history:$compose,
                outbox_delivery:$compose,
                outbox_retry:$compose,
                idempotent_replay:$compose,
                idempotency_conflict:$compose,
                stale_version_rejection:$compose,
                tenant_isolation:$compose,
                concurrent_workers:$postgresql,
                api_restart:$compose,
                worker_restart:$compose,
                full_stack_restart:$compose,
                named_volume_persistence:$compose,
                container_authentication:$compose,
                sse:$compose,
                openapi_drift:$quality
              }
            }' \
            | tee artifacts/summary/verification.json
          {
            echo "# Modoroco hosted verification"
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Python quality: $QUALITY"
            echo "- Server-only profile: $SERVER"
            echo "- Desktop-only profile: $DESKTOP"
            echo "- PostgreSQL integration: $POSTGRESQL"
            echo "- Docker image: $IMAGE"
            echo "- Compose system: $COMPOSE"
            echo
            echo "## System capabilities"
            echo
            for check in \
              "Migrations:$POSTGRESQL" \
              "Concurrent workers:$POSTGRESQL" \
              "OpenAPI drift:$QUALITY" \
              "API liveness:$COMPOSE" \
              "API readiness:$COMPOSE" \
              "Worker readiness:$COMPOSE" \
              "Metrics:$COMPOSE" \
              "Automatic transition:$COMPOSE" \
              "Phase history:$COMPOSE" \
              "Outbox delivery:$COMPOSE" \
              "Outbox retry:$COMPOSE" \
              "Idempotent replay:$COMPOSE" \
              "Idempotency conflict:$COMPOSE" \
              "Stale-version rejection:$COMPOSE" \
              "Tenant isolation:$COMPOSE" \
              "API restart:$COMPOSE" \
              "Worker restart:$COMPOSE" \
              "Full-stack restart:$COMPOSE" \
              "Named-volume persistence:$COMPOSE" \
              "Container authentication:$COMPOSE" \
              "SSE:$COMPOSE"
            do
              echo "- ${check/:/: }"
            done
            echo "- Artifacts: quality-python-313, postgresql-integration, docker-image, compose-system"
          } | tee artifacts/summary/verification.md >> "$GITHUB_STEP_SUMMARY"
          test "$QUALITY" = success
          test "$SERVER" = success
          test "$DESKTOP" = success
          test "$POSTGRESQL" = success
          test "$IMAGE" = success
          test "$COMPOSE" = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-summary
          path: artifacts/summary
          retention-days: 14
