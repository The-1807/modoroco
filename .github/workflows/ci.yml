name: CI
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions: {contents: read}
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_DB: modoroco_test, POSTGRES_USER: modoroco, POSTGRES_PASSWORD: test-only}
        options: >-
          --health-cmd "pg_isready -U modoroco -d modoroco_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    env:
      MODOROCO_ENVIRONMENT: test
      MODOROCO_DATABASE_URL: postgresql+asyncpg://modoroco:test-only@localhost:5432/modoroco_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.8.4", enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: uv sync --frozen --all-extras --all-groups
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pyright
      - run: uv run --no-sync alembic upgrade head
      - run: uv run --no-sync pytest --cov-report=xml
      - run: uv run --no-sync python scripts/generate_openapi.py --check
      - run: docker build -t modoroco:test .
      - run: cp .env.example .env && POSTGRES_PASSWORD=test-only docker compose config --quiet

  server-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.11.29", enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: uv sync --frozen --no-dev --extra server
      - run: uv run --no-sync python scripts/verify_dependency_profile.py server
      - run: uv run --no-sync python scripts/generate_openapi.py --check

  desktop-profile:
    runs-on: ubuntu-latest
    env: {QT_QPA_PLATFORM: offscreen}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with: {version: "0.11.29", enable-cache: true}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libegl1
      - run: uv sync --frozen --extra desktop --group dev
      - run: uv run --no-sync python scripts/verify_dependency_profile.py desktop
      - run: uv run --no-sync pytest tests/test_timer.py

